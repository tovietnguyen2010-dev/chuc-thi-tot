<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Chúc may mắn!🍀</title>

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
    135deg,
    #fff8d6,
    #dfffdc,
    #c9f7ff);

    font-family:Arial,sans-serif;
}

.card{
    text-align:center;
    background:white;
    padding:40px;
    border-radius:30px;
    box-shadow:0 0 30px rgba(0,0,0,.15);
    max-width:700px;
    z-index:10;
}

h1{
    color:#27ae60;
    font-size:52px;
    margin-bottom:15px;
}

p{
    font-size:24px;
    line-height:1.6;
}

button{
    margin-top:20px;
    padding:15px 30px;
    border:none;
    border-radius:30px;
    font-size:20px;
    cursor:pointer;
    background:#ffd93d;
}

.clover{
    position:absolute;
    font-size:35px;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(120vh);
    }
}

.sparkle{
    position:absolute;
    color:gold;
    animation:blink 1.5s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="card">

<h1>🍀 Believe in yourself and do the best! 🍀</h1>

<p>
The exam is only a moment,<br>
your hard work is the real achievement ,<br>
so believe in yourself,<br> 
and show the world what you're capable of ! ✨
</p>

<button onclick="wish()">
🎁 Secret
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script>

for(let i=0;i<40;i++){

let c=document.createElement("div");

c.innerHTML="🍀";

c.className="clover";

c.style.left=Math.random()*100+"vw";

c.style.animationDuration=
(5+Math.random()*10)+"s";

document.body.appendChild(c);
}

for(let i=0;i<40;i++){

let s=document.createElement("div");

s.innerHTML="✨";

s.className="sparkle";

s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";

document.body.appendChild(s);
}

function wish(){

confetti({
particleCount:250,
spread:120
});

setTimeout(()=>{
alert(
"+ Vạn sự may mắn 🍀  \n + Triệu sự tập trung 📚 +10\n + Ngàn sự tin 💯 \n\n Chúc anh chị đậu nguyện vọng mong muốn!"
);
},300);

}

setInterval(()=>{
confetti({
particleCount:80,
spread:70,
origin:{y:0.7}
});
},5000);

</script>

</body>
</html>
